[package]
name = "polgar-pocket"
version = "0.2.0"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-only"
publish = false

[dependencies]
kobo-sdk = { path = "../deps/Cobalt/crates/kobo-sdk" }
shakmaty = "=0.27.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
kobo-ui = { path = "../deps/Cobalt/crates/kobo-ui" }
kobo-text = { path = "../deps/Cobalt/crates/kobo-text" }
kobo-profile = { path = "../deps/Cobalt/crates/kobo-profile" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
